<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Southern Trust Lending — 34s Promo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Lato:wght@300;400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0a; overflow: hidden; }
  body { font-family: 'Lato', system-ui, sans-serif; }
  #root { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="root" data-video-root data-screen-label="t=0s"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="scenes.jsx"></script>

<script type="text/babel">
const CUES = [
  { idx: 1, start: 0,  end: 4,  label: 'Opening' },
  { idx: 2, start: 4,  end: 8,  label: 'The South' },
  { idx: 3, start: 8,  end: 13, label: 'Introduce' },
  { idx: 4, start: 13, end: 18, label: 'Journey' },
  { idx: 5, start: 18, end: 22, label: 'Roots' },
  { idx: 6, start: 22, end: 26, label: 'Promise' },
  { idx: 7, start: 26, end: 30, label: 'Statement' },
  { idx: 8, start: 30, end: 34, label: 'Tagline' },
];

function SeekExposer() {
  const { setTime, setPlaying } = useTimeline();
  React.useEffect(() => {
    window.__seekTo = (t) => { setPlaying(false); setTime(t); };
  }, [setTime, setPlaying]);
  return null;
}

function Video() {
  return (
    <Stage width={1920} height={1080} duration={34} background="#3F5F55" persistKey="stl-promo">
      <Scene1 start={0}  end={4}  />
      <Scene2 start={4}  end={8}  />
      <Scene3 start={8}  end={13} />
      <Scene4 start={13} end={18} />
      <Scene5 start={18} end={22} />
      <Scene6 start={22} end={26} />
      <Scene7 start={26} end={30} />
      <Scene9 start={30} end={34} />
      <SceneLabels cues={CUES} />
      <TimestampLabel />
      <SeekExposer />
    </Stage>
  );
}

function waitForGlobals() {
  if (window.Stage && window.Scene1 && window.Scene9) {
    ReactDOM.createRoot(document.getElementById('root')).render(<Video />);
  } else {
    setTimeout(waitForGlobals, 40);
  }
}
waitForGlobals();
</script>
</body>
</html>
